<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gt::7::init_cipher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f14;
            --card-bg: #1a1d24;
            --text-color: #e2e8f0;
            --primary: #10b981;
            /* Green */
            --warning: #f59e0b;
            /* Orange */
            --secondary: #64748b;
            /* Gray */
            --accent: #3b82f6;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1e293b, #0d0f14);
        }

        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #60a5fa, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            place-items: center;
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .chunk {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 50%;
            aspect-ratio: 1 / 1;
            width: 180px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }

        /* Orange State */
        .chunk.waiting {
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.1);
        }

        .chunk.waiting::before {
            display: none;
        }

        .chunk.waiting .status-dot {
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
        }

        .chunk.waiting .timer {
            color: var(--warning);
        }

        /* Green State */
        .chunk.active {
            transform: translateY(-5px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.2);
        }

        .chunk.active::before {
            display: none;
        }

        .chunk-id {
            font-size: 0.875rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .timer {
            font-size: 3rem;
            font-weight: 600;
            color: var(--secondary);
            transition: color 0.4s ease;
            display: none;
        }

        .chunk.active .timer {
            color: var(--primary);
            display: block;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--secondary);
            margin-top: 0.5rem;
            position: relative;
        }

        .chunk.active .status-dot {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .chunk.active .status-dot::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 1px solid var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .trigger-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .trigger-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .trigger-btn:active {
            transform: scale(0.98);
        }

        .trigger-btn:disabled {
            background: var(--secondary);
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }



        #notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            border-radius: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }

        #notification.show {
            opacity: 1;
        }

        #notification.success {
            border-color: var(--primary);
            color: var(--primary);
        }

        #cipher-display {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            font-family: monospace;
            font-size: 1.25rem;
            color: var(--primary);
            display: none;
            word-break: break-all;
            max-width: 100%;
        }

        #cipher-display.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>gt::7::init_cipher</h1>


        <div class="grid" id="chunk-grid">
            <div class="chunk" id="chunk-1">
                <span class="chunk-id">1</span>
                <span class="timer">00</span>
                <div class="status-dot"></div>
            </div>
            <div class="chunk" id="chunk-2">
                <span class="chunk-id">2</span>
                <span class="timer">00</span>
                <div class="status-dot"></div>
            </div>
            <div class="chunk" id="chunk-3">
                <span class="chunk-id">3</span>
                <span class="timer">00</span>
                <div class="status-dot"></div>
            </div>
            <div class="chunk" id="chunk-4">
                <span class="chunk-id">4</span>
                <span class="timer">00</span>
                <div class="status-dot"></div>
            </div>
        </div>

        <button class="trigger-btn" id="trigger-btn">join</button>

        <div id="cipher-display"></div>


    </div>

    <div id="notification"></div>

    <script>
        const chunkGrid = document.getElementById('chunk-grid');
        const triggerBtn = document.getElementById('trigger-btn');
        const notification = document.getElementById('notification');
        const cipherDisplay = document.getElementById('cipher-display');

        let socket;

        function showNotification(msg, type = '') {
            notification.innerText = msg;
            notification.className = 'show ' + type;
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//localhost:8080/ws`;

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log('Connected to WebSocket');
            };

            socket.onclose = () => {
                console.log('Disconnected from WebSocket');
                setTimeout(connect, 2000);
            };

            socket.onerror = (error) => {
                console.error('WebSocket Error:', error);
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.chunks) {
                    updateUI(data.chunks);
                }

                if (data.already_joined) {
                    if (!data.error) {
                        triggerBtn.disabled = true;
                        triggerBtn.innerText = 'joined';
                    }
                }

                if (data.can_rejoin) {
                    triggerBtn.disabled = false;
                    triggerBtn.innerText = 'join';
                    cipherDisplay.classList.remove('show');
                }

                if (data.error) {
                    showNotification(data.error);
                }

                if (data.cipher_chunk) {
                    cipherDisplay.innerText = data.cipher_chunk;
                    cipherDisplay.classList.add('show');
                }
            };
        }

        function updateUI(chunks) {
            const activeIds = new Set(chunks.map(c => `chunk-${c.id}`));

            // Remove elements no longer in the server's chunk list
            chunkGrid.querySelectorAll('.chunk').forEach(el => {
                if (!activeIds.has(el.id)) {
                    el.remove();
                }
            });

            chunks.forEach(chunk => {
                let chunkEl = document.getElementById(`chunk-${chunk.id}`);
                if (!chunkEl) {
                    chunkEl = document.createElement('div');
                    chunkEl.id = `chunk-${chunk.id}`;
                    chunkEl.className = 'chunk';
                    chunkEl.innerHTML = `
                        <span class="chunk-id">${chunk.id}</span>
                        <span class="timer">00</span>
                        <div class="status-dot"></div>
                    `;
                    chunkGrid.appendChild(chunkEl);
                }
                const timerEl = chunkEl.querySelector('.timer');
                timerEl.innerText = (chunk.timer || 0).toString().padStart(2, '0');

                chunkEl.classList.remove('active', 'waiting');
                if (chunk.status === 'green') {
                    chunkEl.classList.add('active');
                } else if (chunk.status === 'orange') {
                    chunkEl.classList.add('waiting');
                }
            });
        }

        triggerBtn.addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ action: 'join' }));
            }
        });

        connect();
    </script>
</body>

</html>
